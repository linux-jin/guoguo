services:
  juku:
    build: .
    image: juku:local
    init: true
    restart: unless-stopped
    ports:
      # 只给本机浏览器。局域网再改成 "8999:8999"，公网请走反代+登录。
      - "127.0.0.1:8999:8999"
    volumes:
      - ./data:/data
      - ./短剧下载:/downloads
    environment:
      TZ: Asia/Shanghai
      JUKU_FFMPEG: ffmpeg
      JUKU_OUTPUT_DIR: /downloads
