# 免费试用 Blueprint：先能打开页面。
# 没有持久盘；闲置约 15 分钟休眠，缓存和下载会丢。
# FFmpeg 点播在 512MB 上可能内存不足，先看剧库列表即可。
# 首次部署必须填写 JUKU_BASIC_AUTH_USER，密码由 Render 生成。
services:
  - type: web
    name: juku
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: JUKU_FFMPEG
        value: ffmpeg
      - key: JUKU_CONCURRENCY
        value: "1"
      - key: JUKU_WATCH_ONLY
        value: "1"
      - key: JUKU_BASIC_AUTH_USER
        sync: false
      - key: JUKU_BASIC_AUTH_PASS
        generateValue: true
